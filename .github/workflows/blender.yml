name: Blender checks and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release after all checks pass (update version first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blender-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: '4.5.14'
            series: '4.5'
          - blender: '5.2.2'
            series: '5.2'
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install viewport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libxi6 libxfixes3 libxrender1 libxkbcommon0 libsm6 libxxf86vm1
      - name: Download official Blender
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
          BLENDER_SERIES: ${{ matrix.series }}
        run: |
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            --output "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: Numerical, install and real viewport tests
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 scripts/check_blender.py --blender "$BLENDER" --gui
      - name: Save package and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blender-${{ matrix.blender }}
          path: |
            dist/*.zip
            artifacts/*.json
            artifacts/*.log
            artifacts/*.png
          retention-days: 14

  release:
    name: Publish installer
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blender-5.2.2
          path: checked
      - name: Prepare installer assets
        run: python3 scripts/release_assets.py --input checked/dist
      - name: Publish release from this checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(cat release-assets/VERSION)"
          gh release create "v${version}" \
            release-assets/*.zip release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Final Dimensions ${version}" \
            --notes-file release-assets/RELEASE_NOTES.md --latest
